<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="description" data-i18n-attr="content:donate.main_subtitle" content="Support monsmain — donate with cryptocurrency or Iranian Rial.">
  <meta name="theme-color" content="#05070f">
  <meta property="og:title" content="monsmain — Financial Support">
  <meta property="og:description" content="Your contribution empowers me to create more and better content.">
  <meta property="og:type" content="website">
  <title data-i18n="donate.page_title">حمایت مالی</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"

<body class="lang-fa">
  <div id="transition-overlay" aria-hidden="true"></div>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- QR modal -->
  <div id="qr-modal" class="qr-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="qr-title-text">
    <div class="qr-modal-content">
      <button class="qr-close" aria-label="بستن" data-i18n-attr="aria-label:ui.close">&times;</button>
      <h3 class="qr-title" id="qr-title-text" data-i18n="donate.qr_scan">آدرس را اسکن کنید</h3>
      <canvas id="qr-canvas" width="220" height="220"></canvas>
      <p class="qr-address" id="qr-address-text"></p>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="nav">
    <p class="nav-logo">monsmain<span>_</span></p>

    <button class="hamburger" id="hamburger" aria-label="منو" aria-expanded="false" data-i18n-attr="aria-label:ui.menu">
      <span></span><span></span><span></span>
    </button>
    <button class="menu-overlay" id="menu-overlay" aria-label="بستن" tabindex="-1" data-i18n-attr="aria-label:ui.close"></button>

    <div class="menu-panel" id="menu-panel" role="menu">

        <li><a href="../" data-i18n="nav.home" role="menuitem">خانه</a></li>

        <li><a href="../#projects" data-i18n="nav.projects" role="menuitem">پروژه‌ها</a></li>
        <li><a href="../#skills" data-i18n="nav.skills" role="menuitem">مهارت‌ها</a></li>
        <li><a href="../blog/" data-i18n="nav.blog" role="menuitem">بلاگ</a></li>
        <li><a href="#" class="active essential" data-i18n="nav.donate" role="menuitem">حمایت</a></li>
        <li><a href="../#contact" data-i18n="nav.contact" role="menuitem">تماس</a></li>
      </ul>
      <div class="lang-switcher" id="lang-switcher" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="fa">FA</button>
        <span class="lang-sep">/</span>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </nav>

  <nav class="bottom-nav" aria-label="Quick navigation">
    <a href="../" class="bn-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/></svg><span data-i18n="nav.home">خانه</span></a>

    <a href="#" class="bn-link essential active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg><span data-i18n="nav.donate">حمایت</span></a>
    <a href="../#contact" class="bn-link"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></svg><span data-i18n="nav.contact">تماس</span></a>
  </nav>

  <div class="donate-container">
    <div style="height:5rem;flex:0 0 auto"></div>

    <header class="donate-header">
      <img src="images/Logo.png" alt="monsmain" class="main-logo" loading="eager">
      <h1 data-i18n="donate.main_title">حمایت از فعالیت من</h1>
      <p data-i18n="donate.main_subtitle">کمک شما به من انگیزه می‌دهد.</p>
    </header>

    <!-- Tabs -->
    <nav id="tab-container" class="tab-nav" role="tablist" aria-label="Donation method">
      <button class="tab-btn active" data-tab="crypto" role="tab" aria-selected="true">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7v10l10 5 10-5V7L12 2z"/>
            <path d="M12 2v20"/>
            <path d="M2 7l10 5 10-5"/>
          </svg>
        </span>
        <span class="tab-label" data-i18n="donate.tab_crypto">ارز دیجیتال</span>
        <span class="tab-desc" data-i18n="donate.tab_crypto_desc">USDT، ترون، اتریوم...</span>
      </button>
      <button class="tab-btn" data-tab="rial" role="tab" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <path d="M2 10h20"/>
          </svg>
        </span>
        <span class="tab-label" data-i18n="donate.tab_rial">ریالی (تومان)</span>
        <span class="tab-desc" data-i18n="donate.tab_rial_desc">پرداخت به تومان</span>
      </button>
    </nav>

    <!-- Crypto panel -->
    <section class="tab-panel active" data-panel="crypto" role="tabpanel" aria-label="Crypto donations">
      <main id="wallet-container"></main>
    </section>

    <!-- Rial panel -->
    <section class="tab-panel" data-panel="rial" role="tabpanel" aria-label="Rial donations">
      <main id="rial-container"></main>
    </section>

    <!-- Footer -->
    <footer class="donate-footer">
      <div class="social-links">
        <a href="https://github.com/monsmain" target="_blank" aria-label="GitHub" rel="noopener" class="social-link" data-i18n-attr="aria-label:contact.github">
